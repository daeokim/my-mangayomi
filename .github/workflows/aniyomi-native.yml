name: Aniyomi TVWiki build and tests
on:
  push:
    branches: [main]
    paths: ['aniyomi/native/**', '.github/workflows/aniyomi-native.yml']
  pull_request:
    paths: ['aniyomi/native/**', '.github/workflows/aniyomi-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build and test
        run: bash aniyomi/native/gradlew -p aniyomi/native --no-daemon :tvwiki:assembleRelease :tvwiki:testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: tvwiki-unsigned-build-and-tests
          path: |
            aniyomi/native/tvwiki/build/outputs/apk/release/*-unsigned.apk
            aniyomi/native/tvwiki/build/reports/tests/testReleaseUnitTest/
