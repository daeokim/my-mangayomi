<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daeo 주소 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1c2735;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 18px}h1{font-size:26px;margin-bottom:8px}p{line-height:1.55;color:#556274}.panel,article{background:white;border:1px solid #dce2e9;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 6px}input{font-size:16px;padding:12px;border:1px solid #b6c2d1;border-radius:9px;width:100%}button{font-size:16px;min-height:46px;padding:10px 15px;margin:8px 6px 0 0;border:0;border-radius:9px;background:#2357d2;color:white;cursor:pointer}button.secondary{background:#e6edf9;color:#20426c}button:disabled{opacity:.45}h2{font-size:19px;margin:0 0 9px}.status{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.success{color:#14743b}.warning{color:#9a4900}#notice{white-space:pre-wrap;line-height:1.5}small{display:block;color:#556274;line-height:1.5;margin-top:9px}a{color:#2357d2}</style><main><h1>주소 관리 미리보기</h1><p><strong>서버 미활성 · 화면 검토용</strong><br>아래 주소는 초기 설정이며 실제 자동 점검 결과가 아닙니다.</p><p>망가요미 · 애니요미 공통 주소 목록<br>매시간 자동 점검 / 실패하면 이전 주소 유지</p><section class="panel"><label for="token">관리 키</label><input id="token" type="password" disabled autocomplete="off" placeholder="미리보기에서는 키를 입력하지 않습니다"><small>키는 이 페이지의 메모리에서만 사용합니다. 새로 열면 다시 입력하세요.</small><button id="load">불러오기</button><button id="check" class="secondary">지금 점검</button><div id="notice" role="status" aria-live="polite"></div></section><div id="cards"></div><p><a href="../domains.json">공개 주소 목록</a> · 앱에서는 주소 직접 지정란을 비워 자동 갱신을 사용하세요.</p></main><script>
let state=null;const el=id=>document.getElementById(id),labels={'11toon':'11툰',blacktoon:'블랙툰',goodtoon:'굿툰',tvwiki:'티비위키',tvroom:'티비룸'};
function busy(value){document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function api(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await res.json();if(!res.ok)throw Error(data.error||'요청 실패');return data}
function stamp(v){return v?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'아직 없음'}
function render(){el('cards').replaceChildren();Object.entries(state.domains).forEach(([key,d])=>{const article=document.createElement('article'),title=document.createElement('h2'),info=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input'),save=document.createElement('button'),auto=document.createElement('button');title.textContent=labels[key];info.className='status '+(d.status==='healthy'?'success':'warning');info.textContent=d.baseUrl+'\n상태: '+(d.status==='healthy'?'목록 구조 확인':d.status==='unverified'?'초기 설정 · 점검 전':'자동 확인 실패 · 이전 주소 유지')+'\n최근 점검: '+stamp(d.lastCheckedAt)+'\n정상 확인: '+stamp(d.lastConfirmedAt)+'\n'+d.reason;label.textContent='주소 직접 지정 (선택)';input.type='url';input.value=state.control.overrides[key]||'';input.placeholder=d.baseUrl;input.setAttribute('aria-label',labels[key]+' 직접 지정 주소');save.textContent='검증 후 저장';auto.textContent='자동으로 복원';auto.className='secondary';save.onclick=()=>change(key,input.value.trim());auto.onclick=()=>change(key,'');article.append(title,info,label,input,save,auto);el('cards').append(article)});const age=Date.now()-Date.parse(state.lastRunAt||0);el('notice').textContent='자동 점검: '+stamp(state.lastRunAt)+(age>3*3600000?'\n자동 점검이 오래 멈춰 있습니다. Cloudflare Cron/로그를 확인하세요.':'')}
async function act(fn){busy(true);el('notice').textContent='처리 중… 사이트 응답에 따라 시간이 걸립니다.';try{await fn();render()}catch(e){el('notice').textContent=e.message}finally{busy(false)}}
async function change(key,baseUrl){if(!state)return;await act(async()=>{state=await api('/api/override',{key,baseUrl,revision:state.control.revision})})}
el('load').onclick=()=>act(async()=>{state=await api('/api/state')});el('check').onclick=()=>act(async()=>{for(const key of Object.keys(labels)){el('notice').textContent=labels[key]+' 점검 중…';const result=await api('/api/check',{key});state=result.state}});
state={"schemaVersion":1,"updatedAt":null,"lastRunAt":null,"domains":{"11toon":{"baseUrl":"https://11toon.com","status":"unverified","lastConfirmedAt":null,"lastCheckedAt":null,"reason":"초기 설정 주소 · 서버 점검 전","scanOffset":1},"blacktoon":{"baseUrl":"https://blacktoon424.com","status":"unverified","lastConfirmedAt":null,"lastCheckedAt":null,"reason":"초기 설정 주소 · 서버 점검 전","scanOffset":1},"goodtoon":{"baseUrl":"https://goodtoon007.com","status":"unverified","lastConfirmedAt":null,"lastCheckedAt":null,"reason":"초기 설정 주소 · 서버 점검 전","scanOffset":1},"tvwiki":{"baseUrl":"https://tvwiki53.net","status":"unverified","lastConfirmedAt":null,"lastCheckedAt":null,"reason":"초기 설정 주소 · 서버 점검 전","scanOffset":1},"tvroom":{"baseUrl":"https://tvroom38.org","status":"unverified","lastConfirmedAt":null,"lastCheckedAt":null,"reason":"초기 설정 주소 · 서버 점검 전","scanOffset":1}},"control":{"revision":0,"overrides":{}}};render();busy(true);el('notice').textContent='화면 미리보기입니다. Cloudflare 계정 연결과 Secret 등록 후 실제 서버를 활성화합니다.';</script></html>
