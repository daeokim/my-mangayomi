plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'eu.kanade.tachiyomi.animeextension.ko.daeotvwiki'
 compileSdk 35
 defaultConfig { applicationId 'eu.kanade.tachiyomi.animeextension.ko.daeotvwiki'; minSdk 24; targetSdk 35; versionCode 1009; versionName '14.1009'
  // Dtoon is arm64-v8a only; the other three Cronet ABIs were ~19 MB of every APK.
  ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 kotlinOptions { jvmTarget = '1.8' }
 buildTypes { release { minifyEnabled false } }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation project(':cronet')
 compileOnly project(':api')
 compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
 compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
 compileOnly 'org.jsoup:jsoup:1.15.4'
 compileOnly 'io.reactivex:rxjava:1.3.8'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'org.jsoup:jsoup:1.15.4'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
dependencies { testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0' }
